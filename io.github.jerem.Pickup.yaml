id: io.github.jerem.Pickup
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: pickup

finish-args:
  # GUI
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Read the session logs, and append a custom-title entry when renaming.
  - --filesystem=~/.claude
  # The same for pi sessions (a session_info entry when renaming).
  - --filesystem=~/.pi/agent/sessions
  # Run the host terminal + `claude`/`pi`/`gio trash` via flatpak-spawn --host.
  # (The sandbox can't see or exec host binaries directly.)
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: pickup
    buildsystem: simple
    build-commands:
      - install -Dm755 pickup.py /app/bin/pickup
      - install -Dm644 io.github.jerem.Pickup.desktop
        /app/share/applications/io.github.jerem.Pickup.desktop
      - install -Dm644 io.github.jerem.Pickup.metainfo.xml
        /app/share/metainfo/io.github.jerem.Pickup.metainfo.xml
      - install -Dm644 io.github.jerem.Pickup.svg
        /app/share/icons/hicolor/scalable/apps/io.github.jerem.Pickup.svg
    sources:
      - type: dir
        path: .
